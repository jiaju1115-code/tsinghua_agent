corpus:
  chunks_path: ../rag_v0/chunks/chunks.jsonl
  expected_chunks: 717

tfidf:
  analyzer: char
  ngram_range: [2, 4]
  max_features: 60000
  sublinear_tf: true
  norm: l2

dense:
  model_name: BAAI/bge-small-zh-v1.5
  revision: 7999e1d3359715c523056ef9478215996d62a620
  local_model_path: indexes/dense/model
  batch_size: 16
  max_length: 512
  query_instruction: "为这个句子生成表示以用于检索相关文章："

hybrid:
  fusion: rrf
  rrf_k: 60
  sparse_top_n: 20
  dense_top_n: 20
  hybrid_top_k: 10

reranker:
  model_name: BAAI/bge-reranker-base
  revision: 2cfc18c9415c912f9d8155881c133215df768a70
  local_model_path: indexes/reranker/model
  candidate_top_n: 20
  final_top_k: 10
  batch_size: 4
  max_length: 512

evaluation:
  cutoffs: [1, 3, 5, 10]
